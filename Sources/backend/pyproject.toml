[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6"
]

[project.scripts]
wf = "workflow_backend.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]